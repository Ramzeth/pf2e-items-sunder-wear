# Cuts a release whenever the version in VERSION changes.
#
# The version lives in its own file rather than in module.json, because
# module.json is Foundry's artifact while VERSION is the repository's own
# source of truth.
#
# The working cycle is therefore:
#
#   edit code → bump VERSION → commit → push → the release builds itself
#
# Ordinary commits that leave VERSION alone pass in silence: the job asks
# whether a release with that version already exists and stops if it does.
# Without that check every push would try to create the same release and fail.
#
# Everything happens in ONE job on purpose. The obvious alternative — one
# workflow creates the release, a second reacts to it and attaches the files —
# does not work: GitHub deliberately refuses to start a workflow from an event
# raised with the built-in GITHUB_TOKEN, so the second would never run and the
# release would sit there empty.
name: Release

on:
   push:
      branches: [main]
   # For re-cutting a release by hand if one goes wrong.
   workflow_dispatch:

permissions:
   contents: write

env:
   project_url: "https://github.com/${{github.repository}}"
   # Always points at the newest release, which is how Foundry notices that an
   # update exists. It must not name a specific version.
   latest_manifest_url: "https://github.com/${{github.repository}}/releases/latest/download/module.json"

jobs:
   release:
      runs-on: ubuntu-latest
      steps:
         - name: Check out the repository
           uses: actions/checkout@v6

         - name: Read the version
           id: version
           run: |
              VERSION="$(tr -d ' \t\n\r' < VERSION)"
              if [ -z "$VERSION" ]; then
                 echo "::error::VERSION is empty"
                 exit 1
              fi
              echo "value=$VERSION" >> "$GITHUB_OUTPUT"
              echo "Version in VERSION: $VERSION"

         - name: Has this version been released already?
           id: check
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              if gh release view "${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
                 echo "exists=true" >> "$GITHUB_OUTPUT"
                 echo "Release ${{ steps.version.outputs.value }} already exists — nothing to do."
              else
                 echo "exists=false" >> "$GITHUB_OUTPUT"
                 echo "Version ${{ steps.version.outputs.value }} is new — building a release."
              fi

         # Fills the manifest's placeholders on the runner only. Nothing is
         # committed back, so the repository keeps its #{...}# markers.
         #
         # This is also why a raw link to module.json in the repository cannot
         # be installed: a manifest fit for Foundry exists only as a release
         # asset, and this is what makes it.
         - name: Fill in the manifest
           if: steps.check.outputs.exists == 'false'
           uses: cschleiden/replace-tokens@v1
           with:
              files: "module.json"
           env:
              VERSION: ${{ steps.version.outputs.value }}
              URL: ${{ env.project_url }}
              MANIFEST: ${{ env.latest_manifest_url }}
              DOWNLOAD: "https://github.com/${{github.repository}}/releases/download/${{ steps.version.outputs.value }}/module.zip"

         # What Foundry will unpack into Data/modules/. `zip` only warns about
         # files that do not exist, so naming LICENSE and CHANGELOG.md before
         # they are written is harmless.
         #
         # Anything the module needs at runtime has to be listed here. Tests
         # and docs are deliberately left out.
         - name: Build the archive
           if: steps.check.outputs.exists == 'false'
           run: |
              zip --recurse-paths ./module.zip \
                 module.json \
                 README.md \
                 LICENSE \
                 CHANGELOG.md \
                 templates/ \
                 src/ \
                 styles/ \
                 languages/

         - name: Publish the release
           if: steps.check.outputs.exists == 'false'
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              gh release create "${{ steps.version.outputs.value }}" \
                 module.json module.zip \
                 --title "${{ steps.version.outputs.value }}" \
                 --generate-notes
